<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="./assets/runik.png">
    <link rel="stylesheet" href="style.css">
    <script defer src="download.js"></script>
    <title>Download runik</title>
  </head>
  <body>
    <header>
      <div id="logo-container">
        <a href="/"><img id="logo" src="./assets/runik.png" alt="runik logo"/></a>
      </div>
      <a href="https://github.com/runik-3/"><img src="./assets/gh.svg" alt="github logo"></a>
    </header>
    <main>
      <div id="download-container" class="max-width">
        <h1>Download</h1>
        <p>Runik is in early development and currently only supports Kobo e-readers. Kindle support is in the works and coming in a future update.</p>
        <div id="download-links-container">
          <a class="link" target="_blank" id="macos" href=""><img src="./assets/mac.svg" />macOS</a> 
          <a class="link" target="_blank" id="linux" href=""><img src="./assets/linux.svg" />Linux</a> 
          <a class="link" target="_blank" id="windows" href=""><img src="./assets/windows.svg" />Windows</a> 
        </div>
        <strong>Latest: <span id="version"></span><strong>
      </div>
    </main>
  </body>
</html>
